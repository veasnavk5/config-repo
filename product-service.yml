server:
  port: 8082

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/service_discovery
    username: postgres
    password: 112233
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    main:
      allow-bean-definition-overriding: true
    devtools:
      restart:
        enabled: true
        poll-interval: 500ms
        quiet-period: 200ms

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/